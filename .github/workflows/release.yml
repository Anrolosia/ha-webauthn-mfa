name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the release and upload the packaged zip.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # ── Detect first-time contributors ────────────────────────────────
      # Writes /tmp/new_contributors.md, empty when there are none. The
      # section is cosmetic, so every failure path here exits 0 and lets the
      # release go out without it.
      # sha=PREV_TAG is a starting point, not a range: the API walks the
      # full ancestry, so this asks "has this person ever contributed
      # before this release" across the entire project history.
      - name: Detect first-time contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          : > /tmp/new_contributors.md

          if [ -z "$PREV_TAG" ]; then
            echo "Initial release: skipping the new contributors section."
            exit 0
          fi

          if ! gh api "repos/${REPO}/compare/${PREV_TAG}...${CURRENT_TAG}" \
               > /tmp/compare.json 2>/tmp/compare.err; then
            echo "::warning::Could not compare ${PREV_TAG}...${CURRENT_TAG}, skipping the new contributors section."
            cat /tmp/compare.err || true
            exit 0
          fi

          if ! jq -e '.commits' /tmp/compare.json >/dev/null 2>&1; then
            echo "::warning::Unexpected compare payload, skipping the new contributors section."
            exit 0
          fi

          # Every login that authored a commit in the range. This walks the
          # merged branch commits too, which matters: a merge commit is
          # authored by whoever pressed merge, so looking only at the tip
          # would credit the maintainer and miss the contributor entirely.
          # Commits whose email GitHub cannot map to an account have a null
          # author and are skipped, as are bots.
          AUTHORS=$(jq -r '.commits[].author.login // empty' /tmp/compare.json \
            | grep -viE '\[bot\]$|^copilot$' || true)
          AUTHORS=$(printf '%s\n' "$AUTHORS" | sed '/^$/d' | sort -u)

          if [ -z "$AUTHORS" ]; then
            echo "No mappable commit authors in range."
            exit 0
          fi

          NEW=""
          while IFS= read -r login; do
            # Any commit by this author reachable from the previous tag means
            # they are not new. per_page=1 keeps it to one cheap call each.
            # On error we assume "not new" rather than announce a false first.
            prior=$(gh api "repos/${REPO}/commits?sha=${PREV_TAG}&author=${login}&per_page=1" \
              --jq 'length' 2>/dev/null || echo "1")

            if [ "$prior" = "0" ]; then
              sha=$(jq -r --arg l "$login" \
                '[.commits[] | select(.author.login == $l)][0].sha' /tmp/compare.json)
              pr=$(gh api "repos/${REPO}/commits/${sha}/pulls" \
                --jq '.[0].html_url // empty' 2>/dev/null || true)

              if [ -n "$pr" ]; then
                NEW="${NEW}* @${login} made their first contribution in ${pr}"$'\n'
              else
                NEW="${NEW}* @${login} made their first contribution in \`${sha:0:7}\`"$'\n'
              fi
            fi
          done <<< "$AUTHORS"

          if [ -n "$NEW" ]; then
            {
              echo "### 🎉 New Contributors"
              echo ""
              printf '%s' "$NEW"
              echo ""
            } > /tmp/new_contributors.md
            echo "Found new contributors:"
            cat /tmp/new_contributors.md
          else
            echo "No first-time contributors in this range."
          fi

      # ── Generate release notes from conventional commits ──────────────
      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          {
            echo "NOTES<<EOF"

            if [ -z "$PREV_TAG" ]; then
              RANGE="HEAD"
              echo "## 🎉 Initial Release"
              echo ""
            else
              RANGE="${PREV_TAG}..HEAD"
              echo "## What's Changed"
              echo ""
            fi

            FEATURES=$(git log $RANGE --pretty=format:"%s|%h" | grep -E "^feat(\(.+\))?:" || true)
            if [ -n "$FEATURES" ]; then
              echo "### ✨ New Features"
              echo "$FEATURES" | while IFS='|' read -r msg hash; do
                clean=$(echo "$msg" | sed 's/^feat(\(.*\)):/[\1]/' | sed 's/^feat://')
                echo "- $clean (\`$hash\`)"
              done
              echo ""
            fi

            FIXES=$(git log $RANGE --pretty=format:"%s|%h" | grep -E "^fix(\(.+\))?:" || true)
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES" | while IFS='|' read -r msg hash; do
                clean=$(echo "$msg" | sed 's/^fix(\(.*\)):/[\1]/' | sed 's/^fix://')
                echo "- $clean (\`$hash\`)"
              done
              echo ""
            fi

            CHORES=$(git log $RANGE --pretty=format:"%s|%h" | grep -E "^(chore|ci|build|refactor|style|test)(\(.+\))?:" | grep -v "^chore: release v" || true)
            if [ -n "$CHORES" ]; then
              echo "<details>"
              echo "<summary>🔧 Maintenance</summary>"
              echo ""
              echo "$CHORES" | while IFS='|' read -r msg hash; do
                echo "- $msg (\`$hash\`)"
              done
              echo ""
              echo "</details>"
              echo ""
            fi

            if [ -s /tmp/new_contributors.md ]; then
              cat /tmp/new_contributors.md
            fi

            if [ -n "$PREV_TAG" ]; then
              echo "---"
              echo "**Full changelog:** [\`${PREV_TAG}...${CURRENT_TAG}\`](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG})"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Package the integration ───────────────────────────────────────
      - name: Create release zip
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          zip -r "webauthn_mfa-${VERSION}.zip" custom_components/webauthn_mfa/

      # ── Publish the GitHub release ────────────────────────────────────
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.notes.outputs.NOTES }}
          files: "webauthn_mfa-*.zip"