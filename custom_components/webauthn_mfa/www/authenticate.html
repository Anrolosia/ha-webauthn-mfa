<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passkey — Home Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --primary-color: #03a9f4;
      --button-primary-background: #006787;
      --button-secondary-color: #006787;
      --primary-background-color: #fafafa;
      --card-background-color: #fff;
      --primary-text-color: #212121;
      --secondary-text-color: #727272;
      --divider-color: #e0e0e0;
      --error-color: #db4437;
      --success-color: #43a047;
      --info-color: #039be5;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; min-height: 100dvh; margin: 0;
      padding: max(24px, env(safe-area-inset-top)) 16px
        max(24px, env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: center;
      background: var(--primary-background-color);
      color: var(--primary-text-color);
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 400px; padding: 32px;
      border: 1px solid var(--divider-color); border-radius: 12px;
      background: var(--card-background-color); text-align: center;
    }
    .logo { display: block; width: 64px; height: 64px; margin: 0 auto 16px; }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 400; line-height: 1.25; }
    .subtitle {
      margin: 0 0 20px; color: var(--secondary-text-color);
      font-size: 14px; line-height: 1.5;
    }
    .btn {
      min-height: 40px; padding: 8px 20px; border: 0; border-radius: 999px;
      font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .btn:focus-visible { outline: 2px solid var(--button-secondary-color); outline-offset: 2px; }
    .btn:disabled { opacity: 0.65; cursor: default; }
    .btn-primary { width: 100%; background: var(--button-primary-background); color: #fff; }
    .btn-secondary { margin-top: 8px; background: transparent; color: var(--button-secondary-color); }
    .remember-label {
      display: flex; align-items: center; width: fit-content; min-height: 40px;
      gap: 10px; margin-bottom: 12px; color: var(--primary-text-color);
      font-size: 14px; text-align: start; cursor: pointer;
    }
    .remember-label input {
      width: 18px; height: 18px; margin: 0;
      accent-color: var(--primary-color); cursor: pointer;
    }
    .status {
      display: none; margin-top: 16px; padding: 12px 14px;
      border: 1px solid transparent; border-radius: 8px;
      color: var(--primary-text-color); font-size: 14px; line-height: 1.45;
      text-align: start;
    }
    .status.error {
      display: block; border-color: color-mix(in srgb, var(--error-color) 35%, transparent);
      background: color-mix(in srgb, var(--error-color) 10%, transparent);
    }
    .status.success {
      display: block; border-color: color-mix(in srgb, var(--success-color) 35%, transparent);
      background: color-mix(in srgb, var(--success-color) 10%, transparent);
    }
    .status.info {
      display: block; border-color: color-mix(in srgb, var(--info-color) 35%, transparent);
      background: color-mix(in srgb, var(--info-color) 10%, transparent);
    }
    .token-box {
      display: none; margin-top: 16px; padding: 16px;
      border: 1px solid var(--divider-color); border-radius: 8px;
      background: var(--primary-background-color);
    }
    .token-box.visible { display: block; }
    .token-label { margin-bottom: 8px; color: var(--secondary-text-color); font-size: 12px; }
    .token-value {
      padding: 8px; border-radius: 4px; background: var(--card-background-color);
      color: var(--primary-color); font-family: monospace; font-size: 14px;
      word-break: break-all; cursor: pointer; user-select: all;
    }
    .token-hint { margin-top: 8px; color: var(--secondary-text-color); font-size: 12px; }
    .spinner {
      display: inline-block; width: 18px; height: 18px; margin-right: 8px;
      border: 2px solid rgba(255,255,255,.4); border-top-color: currentColor;
      border-radius: 50%; vertical-align: middle; animation: spin .8s linear infinite;
    }
    @media (hover: hover) {
      .btn-primary:hover:not(:disabled) { filter: brightness(.9); }
      .btn-secondary:hover:not(:disabled) {
        background: color-mix(in srgb, var(--button-secondary-color) 10%, transparent);
      }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark; --primary-background-color: #111;
        --card-background-color: #1c1c1c; --primary-text-color: #e1e1e1;
        --secondary-text-color: #a0a0a0; --divider-color: #3a3a3a;
        --button-secondary-color: #37c8fd;
      }
    }
    @media (max-width: 450px) {
      body { align-items: flex-start; padding-top: max(16px, env(safe-area-inset-top)); }
      .card { padding: 24px 16px; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/static/icons/favicon-192x192.png" alt="">
    <h1 id="t-title"></h1>
    <p class="subtitle" id="t-subtitle"></p>

    <label class="remember-label">
      <input type="checkbox" id="remember-me" checked>
      <span id="t-remember"></span>
    </label>
    <button class="btn btn-primary" id="btn-auth" onclick="startAuth()"></button>
    <button class="btn btn-secondary" onclick="goBack()" id="btn-back"></button>

    <div class="token-box" id="token-box">
      <div class="token-label" id="t-token-label"></div>
      <div class="token-value" id="token-value" onclick="copyToken()"></div>
      <div class="token-hint" id="copy-hint"></div>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script>
    // ── i18n (injected server side from www/translations/<lang>.json) ──────
    const T = {{I18N}};
    document.documentElement.lang = {{LANG}};

    // Apply translations to DOM
    document.getElementById("t-title").textContent     = T.title;
    document.getElementById("t-subtitle").textContent  = T.subtitle;
    document.getElementById("t-remember").textContent  = T.remember;
    document.getElementById("btn-auth").textContent    = T.btnAuth;
    document.getElementById("btn-back").textContent    = T.btnBack;
    document.getElementById("t-token-label").textContent = T.tokenLabel;
    document.getElementById("copy-hint").textContent   = T.copyHint;

    // ── App logic ───────────────────────────────────────────────────────────
    const FLOW_ID    = {{FLOW_ID}};
    const RETURN_URL = {{RETURN_URL}};

    function setStatus(msg, type = "info") {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = `status ${type}`;
    }

    function setLoading(loading) {
      const btn = document.getElementById("btn-auth");
      btn.disabled = loading;
      btn.innerHTML = loading
        ? `<span class="spinner"></span>${T.verifying}`
        : T.btnAuth;
    }

    function getSafeReturnUrl(fallback = "/") {
      const urlValue = RETURN_URL || new URLSearchParams(window.location.search).get("return_url") || "";
      if (!urlValue) {
        return fallback;
      }
      try {
        const parsed = new URL(urlValue, window.location.origin);
        if (parsed.origin !== window.location.origin) {
          return fallback;
        }
        return `${parsed.pathname}${parsed.search}${parsed.hash}`;
      } catch (_) {
        return fallback;
      }
    }

    function goBack() {
      sessionStorage.setItem("webauthn_bypass", "1");
      window.location.href = getSafeReturnUrl("/");
    }

    function bufferToBase64url(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function base64urlToBuffer(b64) {
      const b = b64.replace(/-/g, "+").replace(/_/g, "/");
      return Uint8Array.from(atob(b), c => c.charCodeAt(0)).buffer;
    }

    function copyToken() {
      const token = document.getElementById("token-value").textContent;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(token).then(() => {
          const hint = document.getElementById("copy-hint");
          hint.textContent = T.copiedShort;
          hint.style.color = "#86efac";
        });
      }
    }

    async function startAuth() {
      if (!window.PublicKeyCredential) {
        setStatus(T.noSupport, "error");
        return;
      }

      setLoading(true);
      setStatus(T.fetchChallenge, "info");

      try {
        const challengeRes = await fetch("/api/webauthn_mfa/challenge", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ flow_id: FLOW_ID }),
        });

        const options = await challengeRes.json();

        if (!challengeRes.ok) {
          setStatus(options.message || options.error || T.serverError, "error");
          setLoading(false);
          return;
        }

        options.challenge = base64urlToBuffer(options.challenge);
        if (options.allowCredentials) {
          options.allowCredentials = options.allowCredentials.map(c => ({
            ...c, id: base64urlToBuffer(c.id),
          }));
        }

        setStatus(T.waiting, "info");

        const credential = await navigator.credentials.get({ publicKey: options });

        setStatus(T.verifying, "info");

        const assertion = {
          id: credential.id,
          rawId: bufferToBase64url(credential.rawId),
          type: credential.type,
          response: {
            authenticatorData: bufferToBase64url(credential.response.authenticatorData),
            clientDataJSON:    bufferToBase64url(credential.response.clientDataJSON),
            signature:         bufferToBase64url(credential.response.signature),
            userHandle: credential.response.userHandle
              ? bufferToBase64url(credential.response.userHandle) : null,
          },
        };

        let username = "";
        if (credential.response.userHandle) {
          username = new TextDecoder().decode(credential.response.userHandle);
        }

        const verifyRes = await fetch("/api/webauthn_mfa/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ flow_id: FLOW_ID, username, response: assertion }),
        });

        const verifyData = await verifyRes.json();

        if (verifyData.success && verifyData.token) {
          setStatus(T.verified, "success");
          setLoading(false);

          const rememberMe = document.getElementById("remember-me")?.checked ?? true;
          sessionStorage.setItem("webauthn_pending_token", JSON.stringify({
            token: verifyData.token,
            flow_id: FLOW_ID,
            remember_me: rememberMe,
          }));

          setTimeout(() => {
            window.location.href = getSafeReturnUrl("/auth/authorize");
          }, 300);
        } else {
          setStatus(`${T.failed}: ${verifyData.error || T.unknown}`, "error");
          setLoading(false);
        }

      } catch (err) {
        setStatus(
          err.name === "NotAllowedError" ? T.cancelled : `${T.error}: ${err.message}`,
          "error"
        );
        setLoading(false);
      }
    }
  </script>
</body>
</html>
