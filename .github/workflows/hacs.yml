name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS Action
        # Left on the upstream branch, like hassfest: this action enforces the
        # current HACS inclusion rules and pinning it would freeze that check.
        uses: "hacs/action@main"
        with:
          category: "integration"
